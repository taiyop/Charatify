name: Release DMG

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build a test DMG or publish a Nightly from main'
        type: choice
        options: [dmg, nightly]
        default: dmg
      version:
        description: 'Test DMG version (Nightly computes its own version)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: charatify-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'schedule' || vars.NIGHTLY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
      notarize: ${{ steps.version.outputs.notarize }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZE_ENABLED: ${{ vars.RELEASE_NOTARIZE || vars.RELEASE_PUBLISH_ENABLED }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          DMG_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          publish=0
          notarize=0
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$REQUESTED_CHANNEL" == nightly ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Nightly publishing requires main'; exit 1; }
            publish=1
            started="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
            args=()
            if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then args+=(--require-new-commit); fi
            tag="$(python3 scripts/release_version.py nightly "$GITHUB_RUN_NUMBER" "${started%%T*}" "${args[@]}")"
            if [[ -z "$tag" ]]; then
              echo 'This commit already has a Nightly release.'
              exit 0
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then tag="$DMG_VERSION"; fi
            [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable version such as 0.1.0'; exit 1; }
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then publish=1; fi
          fi
          version="${tag#v}"
          build="$version"
          if [[ "$publish" == 1 ]]; then
            build="$(python3 scripts/release_version.py build "$GITHUB_RUN_NUMBER")"
            if [[ "$NOTARIZE_ENABLED" == true ]]; then notarize=1; fi
          fi
          printf 'tag=%s\nversion=%s\nbuild=%s\npublish=%s\nnotarize=%s\n' "$tag" "$version" "$build" "$publish" "$notarize" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      APP_BUILD_VERSION: ${{ needs.prepare.outputs.build }}
      PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
      NOTARIZE_RELEASE: ${{ needs.prepare.outputs.notarize }}
      PACKAGE_DIR: ${{ needs.prepare.outputs.notarize == '1' && 'build/release' || 'build/dmg' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test
        run: make test

      - name: Import Developer ID certificate
        if: env.NOTARIZE_RELEASE == '1'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ vars.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$CERTIFICATE" && -n "$CERTIFICATE_PASSWORD" && -n "$SIGN_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] || { echo 'Complete all Developer ID and notarization settings'; exit 1; }
          [[ "$SIGN_IDENTITY" == 'Developer ID Application: '* ]] || { echo 'APPLE_SIGN_IDENTITY must be a Developer ID Application identity'; exit 1; }
          KEYCHAIN_PATH="$RUNNER_TEMP/charatify-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "CODE_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build notarized DMG and update ZIP
        if: env.NOTARIZE_RELEASE == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: make release

      - name: Build unnotarized DMG and update ZIP
        if: env.NOTARIZE_RELEASE != '1'
        run: make dmg

      - name: Verify the Universal binary and update archive
        run: |
          archs="$(lipo -archs build/Charatify.app/Contents/MacOS/Charatify)"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          cd "$PACKAGE_DIR"
          shasum -a 256 -c SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOTARIZE_RELEASE == '1' && format('Charatify-{0}', env.APP_VERSION) || format('Charatify-{0}-unnotarized', env.APP_VERSION) }}
          path: |
            ${{ env.PACKAGE_DIR }}/*.dmg
            ${{ env.PACKAGE_DIR }}/*.zip
            ${{ env.PACKAGE_DIR }}/SHA256SUMS
          if-no-files-found: error
          overwrite: true

      - name: Publish on GitHub Releases
        if: env.PUBLISH_RELEASE == '1'
        run: python3 scripts/publish-release.py

      - name: Clean signing credentials
        if: always() && env.NOTARIZE_RELEASE == '1'
        run: |
          if [[ -f "$RUNNER_TEMP/charatify-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/charatify-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
